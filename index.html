<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mari's World</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mari's World">
<meta name="theme-color" content="#7fd3f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>
html, body { margin: 0; height: 100%; background: #7fd3f0; overflow: hidden; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  font-family: ui-rounded, "Arial Rounded MT Bold", "Chalkboard SE", system-ui, sans-serif; }
/* Fill the whole screen, including under the iPad status bar, then keep the game inside the safe area.
   The height calc fixes iOS home-screen apps that leave a strip at the bottom with a translucent status bar. */
#stage { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; opacity: 0; }
#stage.show { animation: fadein .35s ease forwards; }
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
.it { transform-box: fill-box; transform-origin: center; }
[data-tap] { cursor: pointer; }
.wiggle { animation: wiggle .5s ease; }
@keyframes wiggle { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-9deg) scale(1.06) } 75% { transform: rotate(9deg) scale(1.06) } }
.yay { animation: yay .7s ease; }
@keyframes yay { 0% { transform: scale(1) } 40% { transform: scale(1.3) rotate(-6deg) } 70% { transform: scale(.95) } 100% { transform: scale(1) } }
.pop-in { animation: popin .5s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes popin { from { transform: scale(0) } to { transform: scale(1) } }
.pop-in.yay { animation: yay .7s ease; }
.pop-in.wiggle { animation: wiggle .5s ease; }
.glowc { opacity: 0; }
.glow .glowc { animation: glow .8s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .25 } to { opacity: 1 } }
.bob { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px) } }
.bob.yay { animation: yay .7s ease; }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08) } }
.mouth { transform-box: fill-box; transform-origin: center top; }
.talking .mouth { animation: talk .26s ease-in-out infinite alternate; }
@keyframes talk { from { transform: scaleY(1.25) } to { transform: scaleY(.35) } }
.arm { transform-box: fill-box; transform-origin: 15% 5%; }
.talking .arm { animation: gesture 1s ease-in-out infinite alternate; }
@keyframes gesture { from { transform: rotate(0) } to { transform: rotate(-30deg) } }
.waving .arm { animation: wave .45s ease-in-out infinite alternate; }
@keyframes wave { from { transform: rotate(-120deg) } to { transform: rotate(-160deg) } }
.bldg { transition: transform .2s; }
.gear .ring { transition: stroke-dashoffset .2s; }
.gear.holding .ring { transition: stroke-dashoffset 2s linear; stroke-dashoffset: 0; }

#overlay { position: fixed; inset: 0; display: none; background: rgba(20,30,60,.55); align-items: center; justify-content: center; touch-action: auto; }
#overlay.open { display: flex; }
.panel { background: #fff; border-radius: 24px; padding: 24px 28px; width: min(720px, 92vw); max-height: 90vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.3); color: #2d2a32; font-family: system-ui, -apple-system, sans-serif; }
.panel h2 { margin: 0 0 12px; font-size: 26px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 14px 0; }
.row span { width: 120px; font-weight: 700; }
.panel button { font: inherit; font-size: 18px; padding: 12px 18px; border-radius: 14px; border: 2px solid #c9cfe0; background: #f5f7fc; color: #2d2a32; }
.panel button.on { background: #4CB944; border-color: #3a9a3a; color: #fff; font-weight: 700; }
.panel button.primary { background: #3A7BE0; border-color: #2c63b8; color: #fff; font-weight: 700; margin-left: auto; }
.panel button.danger { color: #c0392b; }
.note { font-size: 14px; color: #5a5f73; line-height: 1.45; }

</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1400 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="overlay"></div>
<script>
/* Mari's World: all words, people and places.
   Edit this file to change names, looks, lines or items. */
(function (G) {
  const art = g => (g === 'f' ? 'a' : 'o');
  const na = g => (g === 'f' ? 'na' : 'no');
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const NUM = {
    en: ['zero', 'one', 'two', 'three', 'four', 'five'],
    m: ['zero', 'um', 'dois', 'três', 'quatro', 'cinco'],
    f: ['zero', 'uma', 'duas', 'três', 'quatro', 'cinco'],
  };

  const COLORS = {
    red: { hex: '#E8453C', en: 'red', pt: { m: 'vermelho', f: 'vermelha' } },
    blue: { hex: '#3A7BE0', en: 'blue', pt: { m: 'azul', f: 'azul' } },
    yellow: { hex: '#F7C928', en: 'yellow', pt: { m: 'amarelo', f: 'amarela' } },
    green: { hex: '#4CB944', en: 'green', pt: { m: 'verde', f: 'verde' } },
    orange: { hex: '#F58A2A', en: 'orange', pt: { m: 'laranja', f: 'laranja' } },
    purple: { hex: '#9B5DE5', en: 'purple', pt: { m: 'roxo', f: 'roxa' } },
    pink: { hex: '#F78FB3', en: 'pink', pt: { m: 'rosa', f: 'rosa' } },
  };

  /* Looks: skin, hair colour, hair style (short, long, bun, curly, pigtails, thin, wavy),
     shirt, pants, glasses, beard, kid. Change these to match the real family. */
  const GUIDES = {
    mommy: { name: { en: 'Mommy', pt: 'Mamãe' }, g: 'f', look: { skin: '#F2C9A0', hair: '#6B4226', style: 'long', shirt: '#F25F8B', pants: '#3D5A99' } },
    daddy: { name: { en: 'Daddy', pt: 'Papai' }, g: 'm', look: { skin: '#E8B98E', hair: '#3B2A20', style: 'short', shirt: '#3A9AD9', pants: '#45474F', beard: true } },
    maxi: { name: { en: 'Maxi', pt: 'Maxi' }, g: 'm', look: { skin: '#F2C9A0', hair: '#8A5A2B', style: 'short', shirt: '#4CB944', pants: '#3D5A99', kid: true } },
    nana: { name: { en: 'Nana', pt: 'Nana' }, g: 'f', look: { skin: '#F2C9A0', hair: '#C9C3BE', style: 'bun', shirt: '#9B5DE5', pants: '#5C4B73' } },
    papa: { name: { en: 'Papa', pt: 'Papa' }, g: 'm', look: { skin: '#E8B98E', hair: '#D9D4CF', style: 'thin', shirt: '#E8453C', pants: '#6B5B45', glasses: true } },
    gail: { name: { en: 'Nana Gail', pt: 'Nana Gail' }, g: 'f', look: { skin: '#F6D2B4', hair: '#EDE6DF', style: 'curly', shirt: '#2EB8A6', pants: '#3E5C76', glasses: true } },
    spera: { name: { en: 'Nana Spera', pt: 'Nana Spera' }, g: 'f', look: { skin: '#E9BE95', hair: '#8F8A86', style: 'wavy', shirt: '#F58A2A', pants: '#6B4E3D' } },
    mari: { name: { en: 'Mari', pt: 'Mari' }, g: 'f', look: { skin: '#F4CDA8', hair: '#7A4B2A', style: 'pigtails', shirt: '#F7C928', pants: '#F78FB3', kid: true } },
  };

  const GENERIC = {
    praise: [
      { id: 'praise.1', en: 'Yay!', pt: 'Eba!' },
      { id: 'praise.2', en: 'Great job, Mari!', pt: 'Muito bem, Mari!' },
      { id: 'praise.3', en: 'You did it!', pt: 'Você conseguiu!' },
      { id: 'praise.4', en: "Wow, you're so smart!", pt: 'Uau, que esperta!' },
      { id: 'praise.5', en: 'Hooray!', pt: 'Viva!' },
    ],
    tryAgain: { id: 'hint.again', en: "Let's try again!", pt: 'Vamos tentar de novo!' },
    here: { id: 'hint.here', en: 'Look, here it is!', pt: 'Olha, está aqui!' },
    thats: (nm, id) => ({ id: 'hint.that.' + id, en: `That's the ${nm.en}!`, pt: `${nm.g === 'f' ? 'Essa é a' : 'Esse é o'} ${nm.pt}!` }),
    guideTap: [
      { id: 'tap.hi', en: 'Hi Mari!', pt: 'Oi Mari!' },
      { id: 'tap.love', en: 'I love you, Mari!', pt: 'Eu te amo, Mari!' },
      { id: 'tap.fun', en: 'This is fun!', pt: 'Que divertido!' },
    ],
    sticker: { id: 'sticker.got', en: 'You got a sticker!', pt: 'Você ganhou uma figurinha!' },
    bye: { id: 'bye', en: 'Bye bye! See you soon!', pt: 'Tchau tchau! Até logo!' },
  };

  const SHARED = {
    welcome: { id: 'title.welcome', en: "Welcome to Mari's World!", pt: 'Bem-vinda ao Mundo da Mari!' },
    where: { id: 'map.where', en: 'Where do you want to go?', pt: 'Aonde você quer ir?' },
    stickers: { id: 'book.look', en: 'Look at all your stickers!', pt: 'Olha todas as suas figurinhas!' },
    bedtime: { id: 'bedtime', en: 'Time for a rest, Mari. Bye bye!', pt: 'Hora de descansar, Mari. Tchau tchau!' },
    count: [1, 2, 3, 4, 5].map(n => ({ id: 'count.' + n, en: cap(NUM.en[n]) + '!', pt: cap(NUM.m[n]) + '!' })),
  };

  const LOCATIONS = {
    house: {
      id: 'house', name: { en: "Mari's House", pt: 'Casa da Mari' }, to: { en: "Let's go home!", pt: 'Vamos para casa!' },
      guides: ['mommy'], sticker: { art: 'teddy' },
      greet: [{ id: 'house.greet', en: "Hi Mari! It's Mommy!", pt: 'Oi Mari! É a mamãe!' }],
      setup: [{ id: 'house.setup', en: "Let's get ready to go out and play. Can you help me find some things?", pt: 'Vamos nos arrumar para brincar lá fora. Você me ajuda a achar algumas coisas?' }],
      end: [{ id: 'house.end', en: 'We are all ready! Thank you for helping, Mari!', pt: 'Estamos prontas! Obrigada pela ajuda, Mari!' }],
      colors: ['red', 'blue', 'yellow', 'green', 'pink', 'purple'],
      items: [
        { id: 'hairbrush', en: 'hairbrush', pt: 'escova de cabelo', g: 'f', colorable: true, use: { en: 'Which one do we brush our hair with?', pt: 'Com qual a gente penteia o cabelo?' } },
        { id: 'cup', en: 'cup', pt: 'copo', g: 'm', colorable: true, use: { en: 'Which one do we drink from?', pt: 'Em qual a gente bebe?' } },
        { id: 'sock', en: 'sock', pt: 'meia', g: 'f', colorable: true },
        { id: 'ball', en: 'ball', pt: 'bola', g: 'f', colorable: true, use: { en: 'Which one do we kick and throw?', pt: 'Qual a gente chuta e joga?' } },
        { id: 'shoe', en: 'shoe', pt: 'sapato', g: 'm', colorable: true, use: { en: 'What do we wear on our feet?', pt: 'O que a gente usa nos pés?' } },
        { id: 'hat', en: 'hat', pt: 'chapéu', g: 'm', colorable: true, use: { en: 'What do we wear on our head?', pt: 'O que a gente usa na cabeça?' } },
        { id: 'teddy', en: 'teddy bear', pt: 'ursinho', g: 'm', use: { en: 'Which one do we hug at bedtime?', pt: 'Qual a gente abraça na hora de dormir?' } },
        { id: 'spoon', en: 'spoon', pt: 'colher', g: 'f', use: { en: 'Which one do we eat with?', pt: 'Com qual a gente come?' } },
        { id: 'toothbrush', en: 'toothbrush', pt: 'escova de dentes', g: 'f', use: { en: 'Which one do we brush our teeth with?', pt: 'Com qual a gente escova os dentes?' } },
        { id: 'book', en: 'book', pt: 'livro', g: 'm', use: { en: 'Which one do we read?', pt: 'Qual a gente lê?' } },
      ],
      prompts: {
        find: it => ({ id: `house.find.${it.id}`, en: `Can you find the ${it.en}?`, pt: `Você acha ${art(it.g)} ${it.pt}?` }),
        color: (it, c) => ({ id: `house.color.${it.id}.${c}`, en: `Tap the ${COLORS[c].en} ${it.en}!`, pt: `Toque ${na(it.g)} ${it.pt} ${COLORS[c].pt[it.g]}!` }),
        use: it => ({ id: `house.use.${it.id}`, en: it.use.en, pt: it.use.pt }),
      },
    },

    farm: {
      id: 'farm', name: { en: 'Sunny Farm', pt: 'Fazenda do Sol' }, to: { en: "Let's go to the farm!", pt: 'Vamos para a fazenda!' },
      guides: ['nana', 'papa'], sticker: { art: 'cow' },
      greet: [
        { id: 'farm.greet.nana', who: 'nana', en: "Hi Mari! It's Nana!", pt: 'Oi Mari! É a Nana!' },
        { id: 'farm.greet.papa', who: 'papa', en: 'And Papa! Welcome to the farm!', pt: 'E o Papa! Bem-vinda à fazenda!' },
      ],
      setup: [{ id: 'farm.setup', who: 'nana', en: "The animals are playing hide and seek. Let's find them!", pt: 'Os bichinhos estão brincando de esconde-esconde. Vamos achar eles!' }],
      end: [{ id: 'farm.end', who: 'papa', en: 'You found all the animals! Time for their dinner.', pt: 'Você achou todos os bichinhos! Hora do jantar deles.' }],
      items: [
        { id: 'cow', en: 'cow', pt: 'vaca', g: 'f', sound: { en: 'moo', pt: 'muuu' } },
        { id: 'pig', en: 'pig', pt: 'porco', g: 'm', sound: { en: 'oink oink', pt: 'óinc óinc' } },
        { id: 'sheep', en: 'sheep', pt: 'ovelha', g: 'f', sound: { en: 'baa', pt: 'méé' } },
        { id: 'chick', en: 'chick', pt: 'pintinho', g: 'm', sound: { en: 'peep peep', pt: 'piu piu' } },
        { id: 'horse', en: 'horse', pt: 'cavalo', g: 'm', sound: { en: 'neigh', pt: 'hiiinn' } },
        { id: 'duck', en: 'duck', pt: 'pato', g: 'm', sound: { en: 'quack quack', pt: 'quá quá' } },
        { id: 'dog', en: 'dog', pt: 'cachorro', g: 'm', sound: { en: 'woof woof', pt: 'au au' } },
        { id: 'cat', en: 'cat', pt: 'gato', g: 'm', sound: { en: 'meow', pt: 'miau' } },
      ],
      prompts: {
        find: it => ({ id: `farm.find.${it.id}`, en: `Where is the ${it.en}?`, pt: `Cadê ${art(it.g)} ${it.pt}?` }),
        sound: it => ({ id: `farm.sound.${it.id}`, en: `Who says ${it.sound.en}?`, pt: `Quem faz ${it.sound.pt}?` }),
        animal: it => ({ id: `farm.says.${it.id}`, en: cap(it.sound.en) + '!', pt: cap(it.sound.pt) + '!' }),
      },
    },

    market: {
      id: 'market', name: { en: 'Corner Market', pt: 'Mercadinho' }, to: { en: "Let's go to the market!", pt: 'Vamos para o mercadinho!' },
      guides: ['daddy'], sticker: { art: 'apple' },
      greet: [{ id: 'market.greet', en: "Hi Mari! It's Daddy!", pt: 'Oi Mari! É o papai!' }],
      setup: [{ id: 'market.setup', en: "Let's go shopping for a yummy fruit salad!", pt: 'Vamos fazer compras para uma salada de frutas gostosa!' }],
      end: [{ id: 'market.end', en: 'Our basket is full! Yummy fruit salad! Thank you, Mari!', pt: 'A cesta está cheia! Que salada de frutas gostosa! Obrigado, Mari!' }],
      items: [
        { id: 'apple', en: 'apple', enPl: 'apples', pt: 'maçã', ptPl: 'maçãs', g: 'f' },
        { id: 'banana', en: 'banana', enPl: 'bananas', pt: 'banana', ptPl: 'bananas', g: 'f' },
        { id: 'orange', en: 'orange', enPl: 'oranges', pt: 'laranja', ptPl: 'laranjas', g: 'f' },
        { id: 'strawberry', en: 'strawberry', enPl: 'strawberries', pt: 'morango', ptPl: 'morangos', g: 'm' },
        { id: 'pear', en: 'pear', enPl: 'pears', pt: 'pera', ptPl: 'peras', g: 'f' },
        { id: 'watermelon', en: 'watermelon', enPl: 'watermelons', pt: 'melancia', ptPl: 'melancias', g: 'f' },
      ],
      prompts: {
        find: it => ({ id: `market.find.${it.id}`, en: `Can you tap the ${it.en}?`, pt: `Toque ${na(it.g)} ${it.pt}!` }),
        count: (it, n) => ({ id: `market.count.${it.id}.${n}`, en: `Which basket has ${NUM.en[n]} ${n === 1 ? it.en : it.enPl}?`, pt: `Qual cestinha tem ${NUM[it.g][n]} ${n === 1 ? it.pt : it.ptPl}?` }),
        countHint: (it, n) => ({ id: `market.has.${it.id}.${n}`, en: `That one has ${NUM.en[n]}!`, pt: `Essa tem ${NUM[it.g][n]}!` }),
        along: it => ({ id: `market.along.${it.id}`, en: `Let's count the ${it.enPl}! Tap each one.`, pt: `Vamos contar ${it.g === 'f' ? 'as' : 'os'} ${it.ptPl}! Toque em cada ${it.g === 'f' ? 'uma' : 'um'}.` }),
        alongDone: (it, n) => ({ id: `market.counted.${it.id}.${n}`, en: `${cap(NUM.en[n])} ${it.enPl}! Great counting!`, pt: `${cap(NUM[it.g][n])} ${it.ptPl}! Muito bem contado!` }),
      },
    },

    library: {
      id: 'library', name: { en: 'Story Tree Library', pt: 'Biblioteca da Árvore' }, to: { en: "Let's go to the library!", pt: 'Vamos para a biblioteca!' },
      guides: ['gail'], sticker: { art: 'letterM' },
      greet: [{ id: 'library.greet', en: "Hi Mari! It's Nana Gail!", pt: 'Oi Mari! É a Nana Gail!' }],
      setup: [{ id: 'library.setup', en: "Oh no, the letters fell out of the storybook! Let's put them back.", pt: 'Ah não, as letras caíram do livro de histórias! Vamos colocar de volta.' }],
      end: [{ id: 'library.end', en: 'All the letters are back! Now we can read the story. Thank you, Mari!', pt: 'As letras voltaram! Agora podemos ler a história. Obrigada, Mari!' }],
      letters: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
      nameIntro: { id: 'library.name.intro', en: "Let's find the letters in your name. M, A, R, I!", pt: 'Vamos achar as letras do seu nome. M, A, R, I!' },
      nameDone: { id: 'library.name.done', en: 'M, A, R, I. That spells Mari!', pt: 'M, A, R, I. Isso é Mari!' },
      letterName: L => ({ en: `letter ${L}`, pt: `letra ${L}`, g: 'f' }),
      prompts: {
        find: L => ({ id: `library.find.${L}`, en: `Find the letter ${L}!`, pt: `Encontre a letra ${L}!` }),
        name: L => ({ id: `library.name.${L}`, en: `Find the ${L} for Mari!`, pt: `Ache o ${L} de Mari!` }),
      },
    },

    park: {
      id: 'park', name: { en: 'Balloon Park', pt: 'Parque dos Balões' }, to: { en: "Let's go to the park!", pt: 'Vamos para o parque!' },
      guides: ['maxi'], sticker: { art: 'balloon' },
      greet: [{ id: 'park.greet', en: "Hi Mari! It's Maxi!", pt: 'Oi Mari! Sou eu, o Maxi!' }],
      setup: [{ id: 'park.setup', en: "The balloons are flying away. Let's catch them!", pt: 'Os balões estão voando. Vamos pegar eles!' }],
      end: [{ id: 'park.end', en: 'We caught all the balloons! Hooray!', pt: 'Pegamos todos os balões! Viva!' }],
      colors: ['red', 'blue', 'yellow', 'green', 'orange', 'purple', 'pink'],
      balloon: { id: 'balloon', en: 'balloon', pt: 'balão', g: 'm' },
      ball: { id: 'ball', en: 'ball', pt: 'bola', g: 'f' },
      sizes: {
        big: { en: 'big ball', pt: 'bola grande', g: 'f' },
        little: { en: 'little ball', pt: 'bola pequena', g: 'f' },
      },
      prompts: {
        color: c => ({ id: `park.color.${c}`, en: `Pop the ${COLORS[c].en} balloon!`, pt: `Estoure o balão ${COLORS[c].pt.m}!` }),
        size: s => ({ id: `park.size.${s}`, en: `Find the ${s} ball!`, pt: s === 'big' ? 'Ache a bola grande!' : 'Ache a bola pequena!' }),
      },
    },

    garden: {
      id: 'garden', name: { en: "Nana Spera's Garden", pt: 'Jardim da Nana Spera' }, to: { en: "Let's go to Nana Spera's garden!", pt: 'Vamos para o jardim da Nana Spera!' },
      guides: ['spera'], sticker: { art: 'butterfly' },
      greet: [{ id: 'garden.greet', en: "Hi Mari! It's Nana Spera! Welcome to my garden.", pt: 'Oi Mari! É a Nana Spera! Bem-vinda ao meu jardim.' }],
      setup: [{ id: 'garden.setup', en: "Let's look for shapes and little bugs!", pt: 'Vamos procurar formas e bichinhos!' }],
      end: [{ id: 'garden.end', en: 'What a beautiful garden! Thank you, Mari!', pt: 'Que jardim lindo! Obrigada, Mari!' }],
      shapes: [
        { id: 'circle', en: 'circle', pt: 'círculo', g: 'm' },
        { id: 'square', en: 'square', pt: 'quadrado', g: 'm' },
        { id: 'triangle', en: 'triangle', pt: 'triângulo', g: 'm' },
        { id: 'star', en: 'star', pt: 'estrela', g: 'f' },
        { id: 'heart', en: 'heart', pt: 'coração', g: 'm' },
      ],
      bugs: [
        { id: 'butterfly', en: 'butterfly', pt: 'borboleta', g: 'f' },
        { id: 'ladybug', en: 'ladybug', pt: 'joaninha', g: 'f' },
        { id: 'bee', en: 'bee', pt: 'abelha', g: 'f' },
        { id: 'snail', en: 'snail', pt: 'caracol', g: 'm' },
      ],
      prompts: {
        shape: it => ({ id: `garden.shape.${it.id}`, en: `Find the ${it.en}!`, pt: `Ache ${art(it.g)} ${it.pt}!` }),
        bug: it => ({ id: `garden.bug.${it.id}`, en: `Where is the ${it.en}?`, pt: `Cadê ${art(it.g)} ${it.pt}?` }),
      },
    },
  };

  G.MW_DATA = { COLORS, GUIDES, GENERIC, SHARED, LOCATIONS, NUM, cap };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Mari's World: original cartoon art, drawn as SVG.
   Every item is centred on 0,0 and fits roughly inside a 200 x 200 box. */
(function (G) {
  const INK = '#2d2a32';

  /* ---------- sound effects (synthesised, no files) ---------- */
  let actx = null;

  /* ---------- question building ---------- */
  function levelOf(id) { return Math.min(4, Math.max(2, progress.level[id] || 2)); }
  const colorList = ids => ids.map(c => COLORS[c]);
  const choice = (art, name, correct, extra = {}) => Object.assign({ art, name, correct }, extra);

  function slotPositions(n) {
    if (n === 2) return [[720, 600], [1110, 600]];
    if (n === 3) return [[600, 610], [900, 610], [1200, 610]];
    return [[720, 420], [1120, 420], [720, 735], [1120, 735]];
  }

  const ROUNDS = {
    house(n) {
      const L = LOCATIONS.house, items = L.items, out = [];
      const order = shuffle(['find', 'color', 'use', 'color', 'find']);
      const used = [];
      for (const t of order) {
        if (t === 'color') {
          const it = pick(items.filter(i => i.colorable && !used.includes(i)));
          used.push(it);
          const cols = pickN(L.colors, n); const target = cols[0];
          out.push({
            prompt: L.prompts.color(it, target),
            choices: shuffle(cols.map(c => choice(A[it.id](COLORS[c].hex), { en: `${COLORS[c].en} ${it.en}`, pt: `${it.pt} ${COLORS[c].pt[it.g]}`, g: it.g, id: `${it.id}.${c}` }, c === target))),
          });
        } else {
          const pool = t === 'use' ? items.filter(i => i.use) : items;
          const it = pick(pool.filter(i => !used.includes(i)));
          used.push(it);
          const others = pickN(items, n - 1, [it]);
          out.push({
            prompt: t === 'use' ? L.prompts.use(it) : L.prompts.find(it),
            choices: shuffle([it, ...others].map(o => choice(A[o.id](), { en: o.en, pt: o.pt, g: o.g, id: o.id }, o === it))),
          });
        }
      }
      return out;
    },
    farm(n) {
      const L = LOCATIONS.farm, out = [];
      const targets = pickN(L.items, 5);
      ['find', 'find', 'sound', 'find', 'sound'].forEach((t, i) => {
        const it = targets[i], others = pickN(L.items, n - 1, [it]);
        out.push({
          prompt: t === 'sound' ? L.prompts.sound(it) : L.prompts.find(it),
          choices: shuffle([it, ...others].map(o => choice(A[o.id](), { en: o.en, pt: o.pt, g: o.g, id: o.id }, o === it, { says: L.prompts.animal(o) }))),
        });
      });
      return out;
    },
    market(n) {
      const L = LOCATIONS.market, out = [];
      const fr = pickN(L.items, 5);
      const maxN = n <= 2 ? 3 : 5;
      const mkFind = it => ({ prompt: L.prompts.find(it), choices: shuffle([it, ...pickN(L.items, n - 1, [it])].map(o => choice(A[o.id](), { en: o.en, pt: o.pt, g: o.g, id: o.id }, o === it))) });
      const mkCount = it => {
        const nums = pickN([1, 2, 3, 4, 5].filter(k => k <= Math.max(maxN, n)), Math.min(n, 3));
        const target = nums[0];
        return { kind: 'count', item: it, prompt: L.prompts.count(it, target), choices: shuffle(nums.map(k => choice(A.basket(it.id, k), null, k === target, { count: k }))) };
      };
      const mkAlong = it => { const k = 2 + rnd(n <= 2 ? 2 : 4); return { kind: 'along', item: it, n: k, prompt: L.prompts.along(it) }; };
      out.push(mkFind(fr[0]), mkAlong(fr[1]), mkFind(fr[2]), mkCount(fr[3]), mkCount(fr[4]));
      return out;
    },
    library(n) {
      const L = LOCATIONS.library, out = [];
      const cols = ['#E8453C', '#3A7BE0', '#4CB944', '#9B5DE5', '#F58A2A', '#F25F8B', '#2EB8A6'];
      const mk = (T, prompt, extra = {}) => {
        const others = pickN(L.letters, n - 1, [T]);
        const cs = shuffle(cols);
        return Object.assign({ prompt, choices: shuffle([T, ...others]).map((x, i) => choice(A.letter(x, cs[i]), Object.assign({ id: x }, L.letterName(x)), x === T)) }, extra);
      };
      const nameRound = (progress.visits.library || 1) % 2 === 1;
      if (nameRound) {
        'MARI'.split('').forEach((T, i) => out.push(mk(T, L.prompts.name(T), i === 0 ? { intro: L.nameIntro } : i === 3 ? { outro: L.nameDone } : {})));
        out.push(mk(pick(L.letters.filter(x => !'MARI'.includes(x))), L.prompts.find('')));
        out[4].prompt = L.prompts.find(out[4].choices.find(c => c.correct).name.id);
      } else {
        pickN(L.letters, 5).forEach(T => out.push(mk(T, L.prompts.find(T))));
      }
      return out;
    },
    park(n) {
      const L = LOCATIONS.park, out = [];
      ['color', 'size', 'color', 'color', 'size'].forEach(t => {
        if (t === 'size') {
          const s = pick(['big', 'little']), c = COLORS[pick(L.colors)].hex;
          out.push({
            prompt: L.prompts.size(s), kind: 'size',
            choices: shuffle(['big', 'little'].map(k => choice(A.ball(c), Object.assign({ id: k }, L.sizes[k]), k === s, { scale: k === 'big' ? 1.45 : 0.6 }))),
          });
        } else {
          const cols = pickN(L.colors, n), target = cols[0];
          out.push({
            prompt: L.prompts.color(target),
            choices: shuffle(cols.map(c => choice(A.balloon(COLORS[c].hex), { en: `${COLORS[c].en} balloon`, pt: `balão ${COLORS[c].pt.m}`, g: 'm', id: `balloon.${c}` }, c === target, { pop: true }))),
          });
        }
      });
      return out;
    },
    garden(n) {
      const L = LOCATIONS.garden, out = [];
      const cols = ['#E8453C', '#3A7BE0', '#4CB944', '#9B5DE5', '#F58A2A', '#F78FB3', '#F7C928'];
      const sh = pickN(L.shapes, 3), bg = pickN(L.bugs, 2);
      [['shape', sh[0]], ['bug', bg[0]], ['shape', sh[1]], ['bug', bg[1]], ['shape', sh[2]]].forEach(([t, it]) => {
        const pool = t === 'shape' ? L.shapes : L.bugs;
        const cs = shuffle(cols);
        out.push({
          prompt: L.prompts[t](it),
          choices: shuffle([it, ...pickN(pool, n - 1, [it])].map((o, i) => choice(t === 'shape' ? A[o.id](cs[i]) : A[o.id](), { en: o.en, pt: o.pt, g: o.g, id: o.id }, o === it))),
        });
      });
      return out;
    },
  };

  /* ---------- playing a location ---------- */
  async function playLocation(id) {
    const L = LOCATIONS[id];
    progress.visits[id] = (progress.visits[id] || 0) + 1; saveProgress();
    const guides = L.guides;
    const gHtml = guides.length === 1 ? guideSvg(guides[0], 220, 965, 1.4) : guideSvg(guides[0], 150, 960, 1.2) + guideSvg(guides[1], 330, 985, 1.25);
    const tok = newScene(`${BACKGROUNDS[id]()}${gHtml}<g id="choices"></g><g id="labels"></g>${homeBtn()}${banner(oneLine(L.name), LOC_COLOR[id], 690, 58, 38, 700)}<g id="prog" transform="translate(1150 60)"></g><g id="qcard"></g>`, BG_EDGE[id]);
    cur = { id, L, tok, qs: ROUNDS[id](levelOf(id)), i: 0, streak: progress['streak_' + id] || 0 };
    const c = cur;
    setProgress(0, c.qs.length);
    for (const line of [...L.greet, ...L.setup]) {
      setCard(line);
      if (!(await Speech.say(line, guides[0])) || !alive(tok)) return;
    }
    askQuestion(c);
  }

  const speakerFor = c => c.L.guides[c.i % c.L.guides.length];

  async function askQuestion(c) {
    if (!alive(c.tok)) return;
    if (c.i >= c.qs.length) return finishLocation(c);
    const q = c.qs[c.i];
    c.q = q; c.misses = 0; c.locked = false; c.reprompts = 0;
    const layer = stage.querySelector('#choices');
    if (q.kind === 'along') {
      const pos = Array.from({ length: q.n }, (_, k) => [600 + (k * 640) / Math.max(1, q.n - 1), 600 + (k % 2 ? -80 : 60)]);
      if (q.n === 1) pos[0] = [900, 600];
      q.tapped = new Array(q.n).fill(false); q.count = 0;
      layer.innerHTML = pos.map((p, k) => `<g transform="translate(${p[0]} ${p[1]}) scale(.95)"><g class="it choice pop-in" data-tap="cnt${k}" style="animation-delay:${k * 0.08}s">${hit(110)}<circle class="glowc" r="112" fill="#fff59d"/>${item(A[q.item.id]())}<g class="badge"></g></g></g>`).join('');
      stage.querySelector('#labels').innerHTML = '';
    } else {
      const pos = slotPositions(q.choices.length), s = q.choices.length === 4 ? 1.05 : 1.2;
      layer.innerHTML = q.choices.map((ch, k) => `<g transform="translate(${pos[k][0]} ${pos[k][1]}) scale(${s * (ch.scale || 1)})"><g class="it choice pop-in" data-tap="c${k}" style="animation-delay:${k * 0.08}s">${hit(118)}<circle class="glowc" r="120" fill="#fff59d"/>${item(ch.art)}</g></g>`).join('');
      stage.querySelector('#labels').innerHTML = q.choices.map((ch, k) => ch.name ? pill(pos[k][0], pos[k][1] + 118 * s * (ch.scale || 1) + 26, langLines(ch.name), { size: q.choices.length === 4 ? 24 : 27, pad: 16, attrs: `data-tap="c${k}"` }) : '').join('');
    }
    setCard(q.prompt);
    SFX.whoosh();
    if (q.intro) { setCard(q.intro); if (!(await Speech.say(q.intro, speakerFor(c))) || !alive(c.tok)) return; setCard(q.prompt); }
    if (c.q !== q) return;
    await Speech.say(q.prompt, speakerFor(c));
    scheduleReprompt(c, q);
  }

  function scheduleReprompt(c, q) {
    clearTimeout(c.timer);
    c.timer = setTimeout(async () => {
      if (!alive(c.tok) || c.q !== q || c.locked || c.reprompts >= 3) return;
      c.reprompts++;
      stage.querySelectorAll('#choices .choice').forEach(el => restart(el, 'wiggle'));
      await Speech.say(q.prompt, speakerFor(c));
      scheduleReprompt(c, q);
    }, 8000);
  }

  function choiceEl(k) { return stage.querySelector(`[data-tap="c${k}"]`); }
  function centerOf(el) {
    const b = el.getBoundingClientRect(); const p = svgPoint({ clientX: b.left + b.width / 2, clientY: b.top + b.height / 2 }); return p;
  }

  async function onChoice(k) {
    const c = cur; if (!c || c.locked) return;
    const q = c.q, ch = q.choices[k], el = choiceEl(k), who = speakerFor(c);
    if (!ch || !el) return;
    scheduleReprompt(c, q);
    if (ch.correct) {
      c.locked = true; clearTimeout(c.timer);
      restart(el, 'yay'); SFX.yay();
      const p = centerOf(el); burst(p.x, p.y);
      if (ch.pop) { setTimeout(() => { el.style.opacity = '0'; SFX.pop(); }, 500); }
      adapt(c, c.misses === 0);
      setProgress(c.i + 1, c.qs.length);
      const lines = [], pr = pick(GENERIC.praise);
      toast(pr);
      if (ch.says) lines.push(ch.says);
      lines.push(pr);
      if (q.outro) lines.push(q.outro);
      await Speech.say(lines, who);
      if (!alive(c.tok)) return;
      await wait(250);
      c.i++; askQuestion(c);
    } else {
      c.misses++;
      restart(el, 'wiggle'); SFX.soft();
      const right = q.choices.findIndex(x => x.correct);
      const lines = [];
      if (ch.says) lines.push(ch.says);
      if (q.kind === 'count') lines.push(c.L.prompts.countHint(q.item, ch.count));
      else if (q.kind !== 'size') lines.push(GENERIC.thats(ch.name, ch.name.id));
      if (c.misses >= 2) {
        const r = choiceEl(right); if (r) r.classList.add('glow');
        lines.push(GENERIC.here); toast(GENERIC.here, '#3A7BE0');
      } else {
        lines.push(GENERIC.tryAgain, q.prompt); toast(GENERIC.tryAgain, '#F58A2A');
      }
      await Speech.say(lines, who);
    }
  }

  async function onCount(k) {
    const c = cur; if (!c || c.locked) return;
    const q = c.q; if (q.kind !== 'along' || q.tapped[k]) return;
    q.tapped[k] = true; q.count++;
    clearTimeout(c.timer);
    const el = stage.querySelector(`[data-tap="cnt${k}"]`);
    restart(el, 'yay'); SFX.tick(q.count);
    const badge = el.querySelector('.badge');
    badge.innerHTML = `<circle cx="70" cy="-75" r="38" fill="#F25F8B" stroke="${INK}" stroke-width="5"/><text x="70" y="-61" text-anchor="middle" font-size="42" font-weight="900" fill="#fff" font-family="sans-serif">${q.count}</text>`;
    const p = centerOf(el); burst(p.x, p.y, 10, false);
    if (q.count >= q.n) {
      c.locked = true;
      adapt(c, true);
      setProgress(c.i + 1, c.qs.length);
      const done = c.L.prompts.alongDone(q.item, q.n);
      toast(done); setCard(done);
      await Speech.say([SHARED.count[q.count - 1], done, pick(GENERIC.praise)], speakerFor(c));
      if (!alive(c.tok)) return;
      SFX.yay(); burst(900, 500);
      await wait(300);
      c.i++; askQuestion(c);
    } else {
      Speech.say(SHARED.count[q.count - 1], speakerFor(c));
      scheduleReprompt(c, q);
    }
  }

  function adapt(c, firstTry) {
    const id = c.id;
    if (firstTry) {
      c.streak++;
      if (c.streak >= 3) { progress.level[id] = Math.min(4, levelOf(id) + 1); c.streak = 0; }
    } else {
      c.streak = 0;
      if (c.misses >= 2) progress.level[id] = Math.max(2, levelOf(id) - 1);
    }
    progress['streak_' + id] = c.streak;
    saveProgress();
  }

  async function finishLocation(c) {
    const L = c.L;
    progress.stickers[c.id] = (progress.stickers[c.id] || 0) + 1; saveProgress();
    const layer = stage.querySelector('#choices');
    layer.innerHTML = `<g transform="translate(900 560)"><g class="it pop-in" data-tap="home">${hit(200)}
      <circle r="190" fill="#fff6c9" stroke="#F7C928" stroke-width="14" filter="url(#lift)"/>${item(A[L.sticker.art]())}</g></g>${pill(900, 800, langLines(T.earned), { size: 40, bg: '#F7C928', fg: '#5a3d00', sub: '#7a5a10' })}`;
    stage.querySelector('#labels').innerHTML = '';
    setCard(L.end[0]); setProgress(c.qs.length, c.qs.length);
    SFX.yay(); burst(900, 560); setTimeout(() => alive(c.tok) && burst(700, 400), 500); setTimeout(() => alive(c.tok) && burst(1100, 400), 900);
    const g = stage.querySelectorAll('.guide'); g.forEach(x => x.classList.add('waving'));
    await Speech.say([...L.end, GENERIC.sticker], L.guides[0]);
    if (!alive(c.tok)) return;
    await Speech.say(GENERIC.bye, L.guides[L.guides.length - 1]);
    if (!alive(c.tok)) return;
    await wait(1200);
    if (alive(c.tok)) mapScreen();
  }

  /* ---------- parent area ---------- */
  let holdTimer = null;
  function startHold(el) {
    el.classList.add('holding');
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { el.classList.remove('holding'); openSettings(); }, 2000);
  }
  function endHold() { clearTimeout(holdTimer); stage.querySelectorAll('.holding').forEach(e => e.classList.remove('holding')); }

  function openSettings() {
    Speech.stop();
    const btn = (group, val, label) => `<button data-set="${group}" data-val="${val}" class="${String(settings[group]) === String(val) ? 'on' : ''}">${label}</button>`;
    overlay.innerHTML = `<div class="panel">
      <h2>Grown-ups</h2>
      <div class="row"><span>Language</span>${btn('lang', 'en', 'English')}${btn('lang', 'pt', 'Português')}${btn('lang', 'both', 'Both / Ambos')}</div>
      <div class="row"><span>Play time</span>${btn('limit', 0, 'No limit')}${btn('limit', 10, '10 min')}${btn('limit', 15, '15 min')}${btn('limit', 20, '20 min')}</div>
      <div class="row"><span>Voice speed</span>${btn('rate', 0.75, 'Slow')}${btn('rate', 0.9, 'Normal')}${btn('rate', 1, 'Fast')}</div>
      <div class="row"><span>Test voice</span><button data-act="test">Play a sample</button></div>
      <p class="note">Stickers earned: ${Object.values(progress.stickers).reduce((a, b) => a + b, 0)}. Choices per question adapt from 2 to 4.<br>
      Tip: on iPad, use Settings &gt; Accessibility &gt; Guided Access to keep Mari inside the game. For nicer voices, download an "Enhanced" English and Portuguese voice in Settings &gt; Accessibility &gt; Spoken Content &gt; Voices.</p>
      <div class="row"><button data-act="reset" class="danger">Reset progress</button><button data-act="close" class="primary">Back to the game</button></div>
    </div>`;
    overlay.classList.add('open');
  }
  overlay.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.set) {
      const g = b.dataset.set, v = b.dataset.val;
      settings[g] = g === 'lang' ? v : Number(v);
      saveSettings();
      if (g === 'limit') { sessionStart = Date.now(); bedtimeShown = false; }
      openSettings();
    } else if (b.dataset.act === 'test') {
      Speech.say(SHARED.welcome);
    } else if (b.dataset.act === 'reset') {
      if (b.dataset.confirm) { progress.stickers = {}; progress.level = {}; progress.visits = {}; Object.keys(progress).filter(k => k.startsWith('streak_')).forEach(k => delete progress[k]); saveProgress(); openSettings(); }
      else { b.dataset.confirm = '1'; b.textContent = 'Tap again to reset'; }
    } else if (b.dataset.act === 'close') {
      overlay.classList.remove('open'); overlay.innerHTML = '';
      sessionStart = bedtimeShown ? Date.now() : sessionStart; bedtimeShown = false;
      mapScreen();
    }
  });

  /* ---------- input ---------- */
  let lastTap = 0, lastKey = '';
  /* size the game to the real visible screen (iPad home-screen apps can report 100vh wrongly) */
  function fit() { stage.style.width = window.innerWidth + 'px'; stage.style.height = window.innerHeight + 'px'; }
  fit(); window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 300));
  stage.addEventListener('pointerdown', e => {
    if (!e.isPrimary) return;
    e.preventDefault();
    audioInit();
    const t = e.target.closest('[data-tap]');
    if (!t) { const p = svgPoint(e); burst(p.x, p.y, 8, false); SFX.sparkle(); return; }
    const key = t.dataset.tap;
    if (key === 'gear') return startHold(t);
    const now = Date.now(); if (key === lastKey && now - lastTap < 250) return; lastTap = now; lastKey = key;
    handleTap(key, t);
  });
  window.addEventListener('pointerup', endHold);
  window.addEventListener('pointercancel', endHold);
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());

  async function handleTap(key, el) {
    if (key === 'start') {
      Speech.unlock(); SFX.yay();
      mapScreen(true);
      return;
    }
    if (key.startsWith('loc:')) {
      const id = key.slice(4);
      const tok = sceneTok;
      SFX.whoosh();
      const p = centerOf(el); burst(p.x, p.y, 14, false);
      stage.querySelectorAll(`.it[data-tap="loc:${id}"]`).forEach(x => restart(x, 'yay'));
      setTimeout(() => { if (alive(tok)) playLocation(id); }, 280);
      return;
    }
    if (key === 'home') { SFX.pop(); return mapScreen(); }
    if (key === 'repeat') {
      restart(el, 'yay'); SFX.pop();
      if (cur && cur.q && !cur.locked) { stage.querySelectorAll('#choices .choice').forEach(x => restart(x, 'wiggle')); Speech.say(cur.q.prompt, speakerFor(cur)); scheduleReprompt(cur, cur.q); }
      return;
    }
    if (key === 'book') { SFX.sparkle(); return stickerScreen(); }
    if (key === 'fun') { restart(el, 'wiggle'); funSfx(); const p = centerOf(el); burst(p.x, p.y, 8, false); return; }
    if (key.startsWith('guide:')) {
      restart(el, 'yay'); SFX.boing();
      if (!cur) Speech.say(pick(GENERIC.guideTap), key.slice(6));
      return;
    }
    if (key.startsWith('stk:')) {
      const id = key.slice(4); restart(el, 'wiggle'); SFX.sparkle();
      Speech.say(LOCATIONS[id].name);
      return;
    }
    if (key.startsWith('cnt')) return onCount(Number(key.slice(3)));
    if (key.startsWith('c')) return onChoice(Number(key.slice(1)));
  }

  /* expose a tiny API for testing */
  window.MW = { ask: askQuestion, mapScreen, playLocation, stickerScreen, titleScreen, settings, progress, ROUNDS, Speech, state: () => cur };
  titleScreen();
})();

</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function(){});</script>
